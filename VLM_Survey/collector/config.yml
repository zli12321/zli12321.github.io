# VLM Radar configuration.
#
# Everything the collector does is declared here: what counts as in-domain, how
# records are bucketed, which sources are queried, and which named artifacts get
# pinned. Editing this file is the normal way to retune the radar -- the Python
# code carries no hardcoded keyword lists.

radar:
  # How far back a scan looks for "new" activity.
  lookback_hours: 48
  # Curated survey entries arrive in batches every few weeks, so they decay on a
  # much slower clock than an arXiv listing.
  curated_lookback_hours: 720
  # Sources return hundreds of rows a day. Cap per source, not globally, so one
  # chatty source cannot crowd out the rest.
  max_items_per_source: 300
  # The snapshot and dashboard keep every scored record; only the Markdown digest
  # is truncated.
  report_limit: 400
  issue_item_limit: 40
  # Explainable 0-100 scale. See src/vlm_radar/rubric.py for the weights. Thirty
  # keeps single-category records that carry real evidence while the domain and
  # category gates do the heavy filtering.
  minimum_score: 30

# A record must mention the vision-language domain to be eligible at all. Without
# this gate, text-only LLM papers flood every query, because "benchmark" and
# "evaluation" are modality-agnostic words.
domain:
