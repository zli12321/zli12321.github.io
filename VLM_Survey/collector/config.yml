# Named benchmarks and eval harnesses worth surfacing whenever they move.
watchlist:
  - name: MMMU
    aliases: [mmmu, mmmu pro]
    note: College-level multi-discipline multimodal understanding.
  - name: MMBench
    aliases: [mmbench, mmbench video]
    note: Fine-grained multimodal capability suite with CircularEval.
  - name: MMStar
    aliases: [mmstar]
    note: Vision-indispensable subset probing genuine visual dependence.
  - name: MathVista / MathVision
    aliases: [mathvista, mathvision, mathverse, math vista, math vision]
    note: Visual mathematical reasoning.
  - name: SEED-Bench
    aliases: [seed bench, seedbench]
    note: Generative comprehension across image and video dimensions.
  - name: MME
    aliases: [mme, mme realworld, mme survey]
    note: Perception and cognition breadth measurement.
  - name: Video-MME
    aliases: [video mme, videomme, video mme v2]
    note: Full-spectrum video analysis under varying durations.
  - name: BLINK
    aliases: [blink benchmark, blink]
    note: Core visual perception tasks that humans solve in a blink.
  - name: HallusionBench / POPE
    aliases: [hallusionbench, pope, chair metric, amber benchmark]
    note: Hallucination and visual illusion diagnosis.
  - name: ChartQA / DocVQA
    aliases: [chartqa, docvqa, infographicvqa, textvqa, ocrbench]
    note: Document, chart, and scene-text understanding.
  - name: RealWorldQA
    aliases: [realworldqa, real world qa]
    note: Spatial understanding of real-world driving scenes.
  - name: VLMEvalKit / lmms-eval
    aliases: [vlmevalkit, lmms eval, lmms-eval, open compass multimodal]
    note: The two harnesses most VLM papers report through.
  - name: PhysBench / WorldModelBench
    aliases: [physbench, worldmodelbench, worldsimbench, videophy, vbench]
    note: Physical plausibility and world-model evaluation.
  - name: EmbodiedBench / CALVIN
    aliases: [embodiedbench, calvin benchmark, vlmbench, vima bench, libero]
    note: Embodied and manipulation policy evaluation.
  - name: WebArena / OSWorld
    aliases: [webarena, osworld, screenspot, mind2web, androidworld]
    note: GUI and web agent evaluation.

# Records matching these patterns are demoted or dropped. Most of them exist
# because a specific source produces predictable noise: Hugging Face search is
# dominated by quantized re-uploads, and GitHub search surfaces link lists.
low_value:
  demote:
    - pattern: "(?i)\\b(gguf|awq|gptq|w4a16|int4|int8|bnb 4bit|mlx|onnx|openvino|safetensors mirror)\\b"
      reason: Derivative quantization or format conversion of an existing model.
    - pattern: "(?i)\\b(lora|qlora) (adapter|weights)\\b"
      reason: Adapter weights rather than a new model.
    - pattern: "(?i)\\b(fine ?tuned? (version|copy) of|merge of|merged model|duplicate of|mirror of|copy of)\\b"
      reason: Derivative upload of an existing artifact.
    - pattern: "(?i)\\b(awesome|paper list|reading list|curated list|collection of papers)\\b"
      reason: Link collection rather than a primary artifact.
  suppress:
    - pattern: "(?i)^(test|untitled|my dataset|my model|new dataset|example|demo|tmp|temp)\\b"
      reason: Placeholder upload.
    - pattern: "(?i)\\b(withdrawn|retracted|submission placeholder)\\b"
      reason: Withdrawn or placeholder record.

sources:
  # arXiv category RSS is the highest-signal free feed for VLM papers. The Atom
  # query API is available too but rate limits hard, so it is off by default.
  arxiv:
    enabled: true
    required: true
    rss_categories: [cs.CV, cs.CL, cs.AI, cs.LG, cs.RO, cs.MM]
    request_delay_seconds: 3
    atom_enabled: false
    atom_queries:
      - 'abs:"vision language model" OR abs:"multimodal large language model"'
      - '(abs:"vision language" AND (abs:benchmark OR abs:dataset))'
      - 'abs:"vision language action" OR abs:"world model"'
    atom_max_results: 100

  # Where new model weights actually land.
  huggingface_models:
    enabled: true
    required: false
    searches:
      - vision-language
      - multimodal
      - vlm
      - image-text-to-text
      - video-text-to-text
      - omni
    pipeline_tags: [image-text-to-text, video-text-to-text, any-to-any, visual-question-answering]
    # Fetching a model card costs one extra request each, so only the freshest
    # results get prose.
    card_limit: 14

  huggingface_datasets:
    enabled: true
    required: false
    searches:
      - vision-language
      - multimodal benchmark
      - visual instruction
      - vqa
      - video understanding
      - image caption
    card_limit: 10

  # The Hugging Face daily papers feed is the closest thing to a community
  # front page for multimodal work.
  huggingface_papers:
    enabled: true
    required: false
    days: 3

  github:
    enabled: true
    required: false
    queries:
      - '"vision language model" in:name,description,readme'
      - '"multimodal LLM" in:name,description,readme'
      - '"VLM benchmark" in:name,description,readme'
      - '"vision language action" in:name,description,readme'
    per_page: 40

  github_releases:
    enabled: true
    required: false
    repositories:
      - QwenLM/Qwen3-VL
      - OpenGVLab/InternVL
      - open-compass/VLMEvalKit
      - EvolvingLMMs-Lab/lmms-eval
      - haotian-liu/LLaVA
      - LLaVA-VL/LLaVA-NeXT
      - huggingface/transformers
      - vllm-project/vllm
      - OpenBMB/MiniCPM-V
      - deepseek-ai/DeepSeek-VL2
      - THUDM/GLM-V
      - allenai/molmo
      - huggingface/lighteval
      - NVIDIA/Cosmos
    per_page: 10

  semantic_scholar:
    enabled: true
    required: false
    searches:
      - vision language model benchmark
      - multimodal large language model evaluation
      - vision language action robot policy
    page_size: 100
    max_requests: 3

  openalex:
    enabled: false
    required: false
    searches:
      - vision language model evaluation
      - multimodal benchmark dataset
    per_page: 50

  # The sibling survey repository is treated as a first-class source: its
  # progressive reports are dated, human-curated discovery events.
  survey:
    enabled: true
    required: false
    # Local checkout, relative to this collector directory. Set
    # VLM_RADAR_SURVEY_PATH to override, which is how CI points at the copy it
    # checks out into .survey-source.
    path: ../../../VLM_survey/Vision-Language-Models-Overview
    readme: README.md
    reports_dir: progressive reports
    # Section heading -> categories. Matching is case-insensitive substring on
    # the heading trail, so "4.3.1 Manipulation" inherits from "Robotics".
    heading_categories:
      sota vlm: [vlm_model]
      new sota: [vlm_model]
      world model: [world_model]
      training dataset: [dataset]
      pre-training: [dataset]
      dataset and evaluation: [benchmark, dataset]
      datasets and evaluation: [benchmark, dataset]
      new benchmark: [benchmark]
      benchmark: [benchmark]
      embodied vlm: [embodied_vla, benchmark]
      post-training: [post_training]
      post training: [post_training]
      rl alignment: [post_training]
      finetuning: [post_training]
      sft: [post_training]
      prompt: [post_training]
      generative visual media: [generation]
      robotics: [embodied_vla]
      manipulation: [embodied_vla]
      navigation: [embodied_vla]
      human-robot: [embodied_vla]
      autonomous driving: [embodied_vla]
      human-centered: [domain_apps]
      web agent: [gui_agent]
      web-gui: [gui_agent]
      gui: [gui_agent]
      accessibility: [domain_apps]
      medical: [domain_apps]
      healthcare: [domain_apps]
      social goodness: [domain_apps]
      challenge: [safety]
      hallucination: [hallucination]
      safety: [safety]
      fairness: [safety]
      alignment: [post_training]
      efficient: [efficiency]
      efficient inference: [efficiency]
      quantization: [efficiency]
      reasoning: [reasoning]
      video: [video]
      scarce of high-quality dataset: [dataset]

publish:
  site_title: Multimodal Model RADAR
  tagline: A daily map of vision-language model releases, papers, benchmarks, and datasets.
  dashboard_url: "https://zli12321.github.io/VLM_Survey/"
  repository: zli12321/zli12321.github.io
  # The dashboard is served from the parent directory so its public URL is
  # /VLM_Survey/ rather than /VLM_Survey/collector/site/. Jekyll copies that
  # folder verbatim; it skips this collector via _config.yml's exclude list.
  site_dir: ".."
  issue_title_prefix: "🛰️ VLM Radar"
  labels: [daily-radar, automated]
