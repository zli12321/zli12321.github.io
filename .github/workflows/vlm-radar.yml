name: Daily VLM radar scan

# Collects new vision-language model releases, papers, benchmarks, and datasets,
# writes a dated snapshot, rebuilds VLM_Survey/data/radar.json, and redeploys the
# site. Source lives in VLM_Survey/collector.

on:
  schedule:
    # 06:20 UTC, after the arXiv announcement cycle.
    - cron: "20 6 * * *"
  workflow_dispatch:
    inputs:
      publish_issue:
        description: Publish or update today's digest Issue
        required: true
        type: boolean
        default: false

concurrency:
  group: vlm-radar
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: VLM_Survey/collector

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # The curated Atlas is parsed from a separate repository, so the daily run
      # checks it out to refresh data/atlas.json. Without this the Atlas view
      # would freeze at whatever was last committed.
      - name: Check out the survey repository
        uses: actions/checkout@v4
        with:
          repository: zli12321/Vision-Language-Models-Overview
          path: .survey-source
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: VLM_Survey/collector/pyproject.toml

      - run: python -m pip install '.[dev]'

      - name: Check the collector still passes its own tests
        run: |
          ruff check .
          pytest -q

      - name: Refresh the curated catalogue
        env:
          VLM_RADAR_SURVEY_PATH: ${{ github.workspace }}/.survey-source
        run: vlm-radar atlas

      - name: Collect, snapshot, and rebuild the dashboard
        env:
          # Read-only token: raises the GitHub search rate limit, nothing more.
          GITHUB_TOKEN: ${{ github.token }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
          VLM_RADAR_SURVEY_PATH: ${{ github.workspace }}/.survey-source
        run: vlm-radar run

      - name: Upload the run for inspection
        uses: actions/upload-artifact@v4
        with:
          name: vlm-radar-${{ github.run_id }}
          path: |
            VLM_Survey/collector/out/
            VLM_Survey/collector/data/
            VLM_Survey/data/radar.json
          retention-days: 30

      - name: Commit the new data
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "vlm-radar[bot]"
          git config user.email "vlm-radar[bot]@users.noreply.github.com"
          git add VLM_Survey/collector/data VLM_Survey/data/radar.json
          # The scan may only append a dated snapshot, refresh the catalogue, and
          # rewrite the dashboard. Anything else means something went wrong.
          if git diff --cached --name-only | grep -Ev \
            '^VLM_Survey/(collector/data/(snapshots/[0-9]{4}-[0-9]{2}-[0-9]{2}\.json|atlas\.json)|data/radar\.json)$'
          then
            echo "::error::The scan tried to modify an unexpected path"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Today's data is already current"
            exit 0
          fi
          git commit -m "Record daily VLM radar scan"
          git push origin HEAD:main

  # Called explicitly: the commit above uses GITHUB_TOKEN, and GitHub does not
  # start workflows from those pushes, so the site would otherwise never rebuild.
  deploy:
    needs: collect
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  publish-issue:
    needs: collect
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_issue)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download the rendered digest
        uses: actions/download-artifact@v4
        with:
          name: vlm-radar-${{ github.run_id }}
          path: generated/

      - name: Create or update today's issue
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          date_key="$(date -u +%Y-%m-%d)"
          title="🛰️ VLM Radar — ${date_key}"
          existing="$(gh issue list --state all --search "\"${title}\" in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" | head -1)"
          body="generated/VLM_Survey/collector/out/report.md"
          if [[ -n "${existing}" ]]; then
            gh issue edit "${existing}" --body-file "${body}"
            echo "Updated issue #${existing}"
          else
            gh issue create --title "${title}" --body-file "${body}" \
              --label daily-radar --label automated
          fi
